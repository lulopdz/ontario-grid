name: Update and publish

# Every hour: fetch what's new from IESO (and anything missing from the last 7 days), commit the
# CSVs in data/ and publish the site to GitHub Pages. GitHub's cron is best-effort (runs can be
# hours late or skipped; the next one fills the gap); "Run workflow" on the Actions page forces one.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'site/**', 'build.py', 'ingest/**', 'requirements.txt', '.github/workflows/**' ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    # Everything but the hourly FSA archive (~55 MB a year, never read here): data/fsa_manifest.csv
    # tells the update which months are stored, and a new month is added with git add --sparse.
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |
          /*
          !/data/fsa_hourly/
        sparse-checkout-cone-mode: false

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - run: pip install -r requirements.txt

    # If IESO fails the site is still published with what we have; the next run retries
    # everything that is missing.
    - name: Fetch IESO data
      id: ingest
      continue-on-error: true
      run: python ingest/update.py

    - name: Commit new data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add --sparse data
        if git diff --cached --quiet; then
          echo "No new data"
        else
          git commit -q -m "IESO data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
        fi

    - name: Build the site
      run: python build.py

    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Mark the run red if the fetch failed
      if: steps.ingest.outcome == 'failure'
      run: |
        echo "::error::The IESO fetch failed; the site was published with the previous data."
        exit 1

  publish:
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
