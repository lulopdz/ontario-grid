name: Actualizar y publicar

# Cada hora: trae de IESO lo nuevo (y lo que falte de los últimos 7 días), guarda los CSV en
# data/ y publica el sitio en GitHub Pages. El cron de GitHub puede atrasarse (a veces horas);
# "Run workflow" en la página de Actions lo corre a mano.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'site/**', 'build.py', 'ingest/**', 'requirements.txt', '.github/workflows/**' ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-y-publicar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - run: pip install -r requirements.txt

    # Si IESO falla, se publica igual con lo que ya hay; la próxima hora vuelve a intentar
    # todo lo que falte.
    - name: Descargar datos de IESO
      id: ingesta
      continue-on-error: true
      run: python ingest/update.py

    - name: Guardar los datos nuevos
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data
        if git diff --cached --quiet; then
          echo "Sin datos nuevos"
        else
          git commit -q -m "Datos IESO $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
        fi

    - name: Construir el sitio
      run: python build.py

    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Marcar el run en rojo si la ingesta falló
      if: steps.ingesta.outcome == 'failure'
      run: |
        echo "::error::La descarga de IESO falló; el sitio se publicó con los datos anteriores."
        exit 1

  publicar:
    needs: actualizar
    if: always() && needs.actualizar.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
